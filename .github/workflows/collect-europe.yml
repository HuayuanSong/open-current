name: Collect European readings

on:
  schedule:
    - cron: "24,54 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: europe-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect paced European feeds independently of forecasts
        run: python -u scripts/fetch.py --days 1 --source europe
      - name: Package raw feeds and checksums
        run: python scripts/europe_snapshot.py package
      - uses: actions/upload-artifact@v4
        with:
          name: europe-feeds
          path: .cache/europe-snapshot/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
