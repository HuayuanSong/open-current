name: Refresh Open Current

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch new readings before deployment
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: grid-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Watchdog/manual refreshes use the same outage policy as scheduled runs.
      VALIDATE_DEPLOYMENT: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.refresh) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache forecast dependencies and pinned model weights
        id: forecast-cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/forecast-serving/main-env
            .cache/forecast-serving/ttm-env
            .cache/forecast-serving/models
            .cache/forecast-serving/huggingface
          key: forecast-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('forecast/requirements-*.txt', 'forecast/model-release.json', 'forecast/setup.sh') }}
      - name: Install CPU forecasting environments
        if: steps.forecast-cache.outputs.cache-hit != 'true'
        run: bash forecast/setup.sh
      - name: Cache frozen prospective trial models
        uses: actions/cache@v4
        with:
          path: .cache/forecast-serving/trial-models
          key: weather-trial-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('forecast/trial/model-release.json', 'forecast/trial/protocol.json') }}
      - name: Verify prospective trial model exports
        if: env.VALIDATE_DEPLOYMENT == 'true'
        run: .cache/forecast-serving/main-env/bin/python -m forecast.trial.verify
      - name: Verify exported models against the original experiment
        if: env.VALIDATE_DEPLOYMENT == 'true'
        run: .cache/forecast-serving/main-env/bin/python -m forecast.score
        env:
          FORECAST_TTM_PYTHON: .cache/forecast-serving/ttm-env/bin/python
      - name: Restore the previous seven-day history
        run: python scripts/restore.py
        env:
          SNAPSHOT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Verify demand explanations on the CPU runner
        if: env.VALIDATE_DEPLOYMENT == 'true'
        run: .cache/forecast-serving/main-env/bin/python -m forecast.verify_explanations
      - name: Restore issued forecasts and long input history
        run: .cache/forecast-serving/main-env/bin/python -m forecast.restore
        env:
          SNAPSHOT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Collect public readings (paced to provider limits)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python -u scripts/fetch.py --days 1
      - name: Normalize the refreshed readings
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python scripts/normalize.py
      - name: Issue forecasts and evaluate previously issued outlooks
        id: forecast
        continue-on-error: true
        run: .cache/forecast-serving/main-env/bin/python -m forecast.run --strict
        env:
          FORECAST_TTM_PYTHON: .cache/forecast-serving/ttm-env/bin/python
      - name: Require successful scoring during deployment validation
        if: env.VALIDATE_DEPLOYMENT == 'true'
        run: test "${{ steps.forecast.outcome }}" = success
      - name: Record prospective challengers and score matured outcomes
        id: trial
        continue-on-error: true
        timeout-minutes: 10
        run: .cache/forecast-serving/main-env/bin/python -m forecast.trial.run --strict
        env:
          FORECAST_TTM_PYTHON: .cache/forecast-serving/ttm-env/bin/python
      - name: Require successful trial validation during deployment
        if: env.VALIDATE_DEPLOYMENT == 'true'
        run: test "${{ steps.trial.outcome }}" = success
      - name: Preserve prospective issue evidence
        if: steps.trial.outputs.issued == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weather-trial-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .cache/forecast-serving/trial/inputs.npz
            .cache/forecast-serving/trial/sources.json.gz
            .cache/forecast-serving/trial/baseline-context.json.gz
            .cache/forecast-serving/trial/record.json
          retention-days: 90
      - name: Verify normalization and published data
        run: .cache/forecast-serving/main-env/bin/python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish freshness metadata
        run: python scripts/health.py
      - name: Verify browser data model
        run: node --test tests/*.test.mjs
      - name: Fingerprint assets
        run: python scripts/version_assets.py
      - name: Check explorer, forecast panel and browser regressions
        if: env.VALIDATE_DEPLOYMENT == 'true'
        timeout-minutes: 5
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python tests/browser_suite.py
      - name: Keep deployment validation evidence
        if: env.VALIDATE_DEPLOYMENT == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-validation
          path: |
            test-results/forecasts-*.png
            dist/data/forecasts.json
            dist/data/forecast-trial.json
            .cache/forecast-serving/run/*.json
          retention-days: 3
      - uses: actions/configure-pages@v5
      - name: Record the exact snapshot being published
        run: python scripts/verify_publication.py manifest --site-dir dist --output "$RUNNER_TEMP/publication.json"
      - name: Preserve the expected publication checksums
        uses: actions/upload-artifact@v4
        with:
          name: publication-manifest
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.redeployment.outputs.page_url || steps.deployment.outputs.page_url }}
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - name: Download the expected publication checksums
        uses: actions/download-artifact@v4
        with:
          name: publication-manifest
          path: ${{ runner.temp }}/publication
      - name: Publish GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Verify the snapshot visitors receive
        id: publication
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/verify_publication.py check --manifest "$RUNNER_TEMP/publication/publication.json" --url "$SITE_URL"
      - name: Allow Pages to settle before retrying
        id: retry_delay
        if: steps.deployment.outcome == 'failure' || steps.publication.outcome == 'failure'
        run: sleep 60
      - name: Retry publication of the same artifact once
        id: redeployment
        if: steps.retry_delay.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Require the retried publication to be publicly reachable
        if: steps.redeployment.outcome == 'success'
        timeout-minutes: 5
        run: python3 scripts/verify_publication.py check --manifest "$RUNNER_TEMP/publication/publication.json" --url "$SITE_URL"
